name: Pages

# Publishes the home page and the privacy policy (PRIVACY.md) to
# https://itsadithyakv.github.io/Amply-musicplayer/. Only main may deploy to github-pages.
on:
  push:
    branches: [main]
    paths:
      - PRIVACY.md
      - site/**
      - scripts/build-site.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Convert PRIVACY.md
        run: npx --yes marked@15.0.12 -i PRIVACY.md -o "$RUNNER_TEMP/privacy.html"
      - name: Build site
        run: node scripts/build-site.mjs "$RUNNER_TEMP/privacy.html" _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
